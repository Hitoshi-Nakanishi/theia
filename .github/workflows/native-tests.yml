name: Native viewer

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[arrow]' build twine
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip uninstall -y theia
      - run: python -m pip install --no-index --no-deps --find-links dist theia
      - run: python -I -c "from importlib.metadata import metadata; from PySide6.QtWidgets import QApplication; from theia.app import MainWindow; assert metadata('theia')['License-Expression'] == 'MIT'; app = QApplication([]); window = MainWindow(); window.close()"

  minimal:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install .
      - run: python -I -c "from pathlib import Path; from importlib.util import find_spec; from PySide6.QtWidgets import QApplication; from theia.app import MainWindow; assert find_spec('pyarrow') is None; app = QApplication([]); window = MainWindow(); window.open_path(Path('examples/demo_models/0000.T_Demo_Model.xlsx').resolve()); assert window.table.model().rowCount() > 0; window.close()"
