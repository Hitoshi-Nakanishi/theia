version: '3'

# THEIA_MODELS_PATH, the folder `task run` opens, comes from the environment or .env (see .env.example).
dotenv: ['.env']

vars:
  # Cross-platform venv python. Mac/Linux uses .venv/bin/python; Windows uses
  # .venv/Scripts/python.exe.
  PY: '{{if eq OS "windows"}}.venv/Scripts/python.exe{{else}}.venv/bin/python{{end}}'


tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Create .venv/ and install theia editable (`task run` does this on its first run)
    cmds:
      - python -m venv .venv
      - '{{.PY}} -m pip install -U pip'
      - '{{.PY}} -m pip install -e .'

  venv:
    internal: true
    # Isolated mode leaves this checkout off sys.path, so the import succeeds only after a complete install.
    status:
      - '{{.PY}} -I -c "import theia"'
    cmds:
      - task: install

  build-cython:
    desc: 'Compile _arrow_fast.pyx Cython extension (optional; arrow_model falls back to pure Python)'
    cmds:
      - '{{.PY}} -m pip install cython setuptools --quiet'
      # Windows: use MinGW gcc (install WinLibs UCRT: `winget install
      # BrechtSanders.WinLibs.POSIX.UCRT`, then open a new shell so gcc is on PATH).
      - cmd: '{{.PY}} setup.py build_ext --inplace --compiler=mingw32'
        platforms: [windows]
      # macOS/Linux: default toolchain (clang/gcc).
      - cmd: '{{.PY}} setup.py build_ext --inplace'
        platforms: [darwin, linux]

  run:
    desc: 'Open the model folder, or the workbook, folder or zip after `--` (example: task run -- models.zip)'
    aliases: [run-path]
    deps: [venv]
    # A relative path after `--` is read from the directory `task` was called in.
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - '"{{.TASKFILE_DIR}}/{{.PY}}" -m theia {{.CLI_ARGS}}'

  paths:
    desc: 'Print the configured model folder'
    deps: [venv]
    cmds:
      - '{{.PY}} -c "from theia.paths import models_root; print(models_root())"'

  clean:
    desc: Remove venv and build artifacts
    cmds:
      - cmd: rm -rf .venv theia.egg-info build dist
        platforms: [linux, darwin]
      - cmd: rmdir /S /Q .venv 2>NUL & rmdir /S /Q theia.egg-info 2>NUL & rmdir /S /Q build 2>NUL & rmdir /S /Q dist 2>NUL
        platforms: [windows]
        ignore_error: true
