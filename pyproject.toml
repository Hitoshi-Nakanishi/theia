[project]
name = "theia"
version = "0.1.0"
description = "Fast Excel viewer for valuation models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "python-calamine>=0.2.3",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
]

[project.scripts]
theia = "theia.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["theia"]
